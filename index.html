<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
      background: #171a3a;
      color: #f2e8d5;
    }
    h1 {
      margin: 0;
    }
    .hint {
      margin: 0;
      color: #b9b3d6;
    }
    #whack-button {
      font: inherit;
      font-size: 1.1rem;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid #4a4e8a;
      background: #2a2d55;
      color: #f2e8d5;
      cursor: pointer;
    }
    #whack-button:active {
      transform: scale(0.96);
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
