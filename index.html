<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
      background: #171a3a;
      color: #f2e8d5;
    }
    h1 {
      margin: 0;
    }
    .hint {
      margin: 0;
      color: #b9b3d6;
    }
    #star-count {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffd76a;
    }
    #field {
      display: flex;
      gap: 18px;
    }
    .burrow {
      width: 110px;
      height: 110px;
      font: inherit;
      font-size: 1.2rem;
      border-radius: 16px;
      border: 1px solid #4a4e8a;
      background: #23264a;
      color: #8f89b0;
      cursor: pointer;
    }
    .burrow.up {
      background: #3d4180;
      color: #ffd76a;
      border-color: #ffd76a;
    }
    .burrow.whiff {
      animation: shake 0.24s ease-in-out;
    }
    @keyframes shake {
      25% {
        transform: translateX(-3px);
      }
      75% {
        transform: translateX(3px);
      }
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
