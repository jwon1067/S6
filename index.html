<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Burrow</title>
    <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 50% -80px, #34386b, rgba(52, 56, 107, 0)
        70%),
        linear-gradient(#171a3a, #0b0c20 70%, #090a18);
      color: #f2e8d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 32px 16px 56px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.04em;
    }
    .tagline {
      margin: -14px 0 0;
      color: #b9b3d6;
    }
    #stats {
      display: flex;
      gap: 18px;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: center;
    }
    #star-count {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffd76a;
      font-variant-numeric: tabular-nums;
    }
    #rate {
      margin: 0;
      color: #b9b3d6;
      font-variant-numeric: tabular-nums;
    }
    #field {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
    }
    .burrow {
      position: relative;
      width: 128px;
      height: 128px;
      padding: 0;
      overflow: hidden;
      border-radius: 18px;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .burrow:focus-visible {
      outline: 3px solid #ffd76a;
      outline-offset: 3px;
    }
    .burrow .hole {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .burrow .mole {
      position: absolute;
      bottom: 24px;
      left: 50%;
      width: 64px;
      z-index: 1;
      transform: translateX(-50%) translateY(108%);
      transition: transform 0.16s ease-out;
      pointer-events: none;
    }
    .burrow.up .mole {
      transform: translateX(-50%) translateY(4%);
    }
    .burrow .mole.whacked {
      transform: translateX(-50%) translateY(4%) scale(1.12, 0.72);
      transition-duration: 0.08s;
    }
    .burrow .mole.golden {
      filter: brightness(1.35) saturate(1.5) hue-rotate(-15deg);
    }
    .burrow.whiff {
      animation: shake 0.24s ease-in-out;
    }
    @keyframes shake {
      25% {
        transform: translateX(-3px);
      }
      75% {
        transform: translateX(3px);
      }
    }
    .float-star {
      position: absolute;
      transform: translateX(-50%);
      font-weight: 700;
      color: #ffd76a;
      pointer-events: none;
      animation: rise 0.9s ease-out forwards;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      z-index: 3;
    }
    .float-star.golden {
      color: #ffe9a8;
      font-size: 1.15rem;
    }
    @keyframes rise {
      from {
        opacity: 1;
        transform: translateX(-50%);
      }
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(-44px);
      }
    }
    .shop {
      width: min(480px, 100%);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 14px 16px 16px;
    }
    .shop h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      color: #cfc7ec;
    }
    .upgrade {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      cursor: pointer;
      font: inherit;
    }
    .upgrade:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
    }
    .upgrade:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .upgrade:focus-visible {
      outline: 3px solid #ffd76a;
      outline-offset: 2px;
    }
    .upgrade .name {
      font-weight: 700;
    }
    .upgrade .desc {
      display: block;
      font-size: 0.85rem;
      color: #b9b3d6;
      margin-top: 2px;
    }
    .upgrade .meta {
      display: block;
      font-size: 0.85rem;
      color: #ffd76a;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .upgrade.bought {
      animation: bought-pulse 0.3s ease-out;
    }
    @keyframes bought-pulse {
      50% {
        transform: scale(1.02);
        border-color: #ffd76a;
      }
    }
    .footer {
      margin: 0;
      color: #8f89b0;
      font-size: 0.85rem;
    }
    @media (prefers-reduced-motion: reduce) {
      .burrow .mole,
      .burrow.whiff,
      .float-star {
        transition: none;
        animation: none;
      }
      .float-star {
        opacity: 0;
      }
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
