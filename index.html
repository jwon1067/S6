<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
      background: #171a3a;
      color: #f2e8d5;
    }
    h1 {
      margin: 0;
    }
    .hint {
      margin: 0;
      color: #b9b3d6;
    }
    #star-count {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffd76a;
    }
    #rate {
      margin: 0;
      color: #b9b3d6;
      font-variant-numeric: tabular-nums;
    }
    #field {
      display: flex;
      gap: 18px;
      position: relative;
    }
    .float-star {
      position: absolute;
      transform: translateX(-50%);
      font-weight: 700;
      color: #ffd76a;
      pointer-events: none;
      animation: rise 0.9s ease-out forwards;
      z-index: 2;
    }
    .float-star.golden {
      color: #ffe9a8;
      font-size: 1.15rem;
    }
    @keyframes rise {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(-44px);
      }
    }
    .burrow {
      width: 110px;
      height: 110px;
      font: inherit;
      font-size: 1.2rem;
      border-radius: 16px;
      border: 1px solid #4a4e8a;
      background: #23264a;
      color: #8f89b0;
      cursor: pointer;
    }
    .burrow.up {
      background: #3d4180;
      color: #ffd76a;
      border-color: #ffd76a;
    }
    .burrow.whiff {
      animation: shake 0.24s ease-in-out;
    }
    #shop {
      max-width: 380px;
      width: 100%;
    }
    #shop button {
      width: 100%;
      font: inherit;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #4a4e8a;
      background: #2a2d55;
      color: #f2e8d5;
      cursor: pointer;
    }
    #shop button:hover:not(:disabled) {
      background: #3d4180;
    }
    #shop button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    @keyframes shake {
      25% {
        transform: translateX(-3px);
      }
      75% {
        transform: translateX(3px);
      }
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
